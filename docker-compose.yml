version: "3.9"

# BetRex.app docker-compose
# Designed for VPS with limited free ports.
# Exposes a single port (default 8081) — the proxy in front of frontend + backend.
# You then configure your VPS reverse proxy (Nginx Proxy Manager, Caddy, etc.)
# to route betrex.app → http://127.0.0.1:8081

services:
  mongo:
    image: mongo:7
    container_name: betrex_mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - betrex_net
    # No port exposed — only reachable inside docker network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: betrex_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: ${DB_NAME:-betrex_db}
    depends_on:
      - mongo
    networks:
      - betrex_net
    # No port exposed — only reachable via internal proxy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_BACKEND_URL: ${PUBLIC_URL:-https://betrex.app}
    container_name: betrex_frontend
    restart: unless-stopped
    networks:
      - betrex_net

  proxy:
    image: nginx:1.27-alpine
    container_name: betrex_proxy
    restart: unless-stopped
    ports:
      # Maps host port 8081 -> proxy inside container.
      # Change 8081 to any free port on your VPS if needed (8082, 9000, etc.)
      - "${PROXY_PORT:-8081}:80"
    volumes:
      - ./proxy/nginx-app.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - betrex_net

networks:
  betrex_net:
    driver: bridge

volumes:
  mongo_data:
